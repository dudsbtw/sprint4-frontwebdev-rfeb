<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Jovi Tech</title>
  <link rel="stylesheet" href="style.css">

</head>
<body>

  <h1>Jovi Tech — Câmeras</h1>
  <p>Tecnologia de câmeras inteligentes para smartphones Jovi.</p>

  <nav>
    <button onclick="document.getElementById('slideshow').scrollIntoView({behavior:'smooth'})">Galeria</button>
    <button onclick="document.getElementById('contato').scrollIntoView({behavior:'smooth'})">Contato</button>
    <button onclick="abrirModal()">Entrar</button>
    <button onclick="explorar()">Explorar</button>
  </nav>

  <!-- SLIDESHOW -->
  <div id="slideshow">
    <div id="slide-conteudo"></div>
    <div>
      <button onclick="mudarSlide(-1)">← Anterior</button>
      <span id="slide-num"></span>
      <button onclick="mudarSlide(1)">Próximo →</button>
    </div>
  </div>

  <!-- CARDS -->
  <div id="cards"></div>

  <!-- FORMULÁRIO -->
  <div id="contato">
    <form onsubmit="return false;">
      <h2>Fale Conosco</h2>

      <label for="nome">Nome</label>
      <input type="text" id="nome" placeholder="Seu nome" />
      <span class="erro" id="erro-nome">Preencha o nome.</span>

      <label for="email">E-mail</label>
      <input type="email" id="email" placeholder="seu@email.com" />
      <span class="erro" id="erro-email">E-mail inválido.</span>

      <label for="mensagem">Mensagem</label>
      <textarea id="mensagem" placeholder="Escreva aqui..."></textarea>
      <span class="erro" id="erro-msg">Mínimo de 10 caracteres.</span>

      <button onclick="enviarForm()">Enviar</button>
    </form>
  </div>

  <!-- MODAL LOGIN -->
  <div id="modal">
    <div id="modal-box">
      <button id="fechar-modal" onclick="fecharModal()">✕</button>
      <h3>Login</h3>

      <label for="l-user">Usuário</label>
      <input type="text" id="l-user" placeholder="admin" />

      <label for="l-senha">Senha</label>
      <input type="password" id="l-senha" placeholder="••••••" />

      <button onclick="fazerLogin()">Entrar</button>
      <p id="msg-login"></p>
    </div>
  </div>

  <footer>
    <p id="rodape"></p>
  </footer>

  <script src="script.js"></script>

</body>
</html>
